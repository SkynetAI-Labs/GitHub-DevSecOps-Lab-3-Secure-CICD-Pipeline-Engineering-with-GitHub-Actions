
name: CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  security:
    name: Python security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit==1.9.4

      - name: Scan application code
        run: python -m bandit -r app

  container:
    name: Container security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build --pull -t secure-cicd-demo:${{ github.sha }} .

      - name: Verify container health status
        env:
          IMAGE_TAG: secure-cicd-demo:${{ github.sha }}
        run: |
          docker run --rm "$IMAGE_TAG" | python3 -c '
          import ast
          import sys
          result = ast.literal_eval(sys.stdin.read().strip())
          expected = {"status": "healthy", "service": "secure-cicd-demo"}
          if result != expected:
              raise SystemExit(f"Unexpected health status: {result!r}")
          print("Container health status verified")
          '

      - name: Verify non-root container execution
        env:
          IMAGE_TAG: secure-cicd-demo:${{ github.sha }}
        run: |
          ACTUAL_UID="$(docker run --rm --entrypoint id "$IMAGE_TAG" -u)"
          test "$ACTUAL_UID" = "10001"
          echo "Verified container runtime UID: $ACTUAL_UID"

      - name: Scan container with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secure-cicd-demo:${{ github.sha }}
          scanners: vuln
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: false

      - name: Save scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save secure-cicd-demo:${{ github.sha }} -o scanned-image.tar

      - name: Upload scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scanned-container
          path: scanned-image.tar
          retention-days: 1
          if-no-files-found: error

  delivery:
    name: Publish scanned container
    needs: [test, security, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: scanned-container

      - name: Load scanned image
        run: docker load -i scanned-image.tar

      - name: Sign in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Publish image tagged with commit SHA
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/skynetai-labs/secure-cicd-pipeline-github-actions"
          docker tag "secure-cicd-demo:$COMMIT_SHA" "$IMAGE:$COMMIT_SHA"
          docker push "$IMAGE:$COMMIT_SHA"

      - name: Sign out of registry
        if: always()
        run: docker logout ghcr.io
